services:
  - type: web
    name: facematcher
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: CUDA_VISIBLE_DEVICES
        value: "-1"
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_VIDEO_DURATION_SEC
        value: "90"
      - key: FRONTEND_DIST
        value: /app/frontend_dist
